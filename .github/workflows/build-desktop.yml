name: Build Desktop

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stamp version from tag
        if: github.event_name == 'release'
        run: |
          $ver = "${{ github.event.release.tag_name }}" -replace '^v',''
          npm version $ver --no-git-tag-version --allow-same-version

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package installer
        run: npx electron-builder --win --publish never

      # Upload the installer + auto-update metadata straight to the release
      # that triggered this run, whatever its type (draft/prerelease/stable).
      # Avoids electron-builder's release-type matching, which skips uploads
      # when its default (draft) doesn't match an existing prerelease.
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem release/ReplaySwing-Setup-*.exe
            Get-ChildItem release/*.blockmap -ErrorAction SilentlyContinue
            Get-ChildItem release/latest.yml -ErrorAction SilentlyContinue
          ) | ForEach-Object { $_.FullName }
          gh release upload ${{ github.event.release.tag_name }} $files --clobber

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ReplaySwing-Setup
          path: desktop/release/*.exe
