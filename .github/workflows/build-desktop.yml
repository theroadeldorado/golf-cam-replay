name: Build Desktop

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642195f882d025a3bdf1f1b # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stamp version from tag
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          $ver = $env:TAG_NAME -replace '^v',''
          npm version $ver --no-git-tag-version --allow-same-version

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package installer
        run: npx electron-builder --win --publish never

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem release/ReplaySwing-Setup-*.exe
            Get-ChildItem release/*.blockmap -ErrorAction SilentlyContinue
            Get-ChildItem release/latest.yml -ErrorAction SilentlyContinue
          ) | ForEach-Object { $_.FullName }
          gh release upload "$env:TAG_NAME" $files --clobber

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReplaySwing-Setup
          path: desktop/release/*.exe
