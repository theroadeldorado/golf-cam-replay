name: Build Desktop v2

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    # Releases tagged v2* build the Electron app; older tags stay with the v1 workflow.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v2')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stamp version from tag
        if: github.event_name == 'release'
        run: |
          $ver = "${{ github.event.release.tag_name }}" -replace '^v',''
          npm version $ver --no-git-tag-version --allow-same-version

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package and upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Package (no publish)
        if: github.event_name == 'workflow_dispatch'
        run: npx electron-builder --win --publish never

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ReplaySwing-Setup
          path: desktop/release/*.exe
